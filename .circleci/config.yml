version: 2.1
orbs:
  architect: giantswarm/architect@9.6.0

workflows:
  build:
    jobs:
      - architect/push-to-app-catalog:
          context: "architect"
          executor: "app-build-suite"
          name: "package and push goldilocks-app chart to giantswarm-catalog"
          app_catalog: "giantswarm-catalog"
          app_catalog_test: "giantswarm-test-catalog"
          chart: "goldilocks-app"
          # appVersion tracks upstream goldilocks, not the chart version, so don't stamp it.
          override_app_version: false
          # Trigger job on git tag.
          filters:
            tags:
              only: /^v.*/

      - architect/push-to-app-catalog:
          context: "architect"
          executor: "app-build-suite"
          name: "package and push goldilocks-app chart to control-plane-catalog"
          app_catalog: "control-plane-catalog"
          app_catalog_test: "control-plane-test-catalog"
          chart: "goldilocks-app"
          # appVersion tracks upstream goldilocks, not the chart version, so don't stamp it.
          override_app_version: false
          # Trigger job on git tag.
          filters:
            tags:
              only: /^v.*/
